# Callosemic stack battery: akasa -> sutram -> insetu, stopping at the first red suite.
#
# Every repo's CI calls this one workflow, so a push anywhere runs the identical battery.
# The pushed repo is always tested at its pushed commit. The other two are resolved per mode:
#   main   -> their default branch, main or master (what the live workbench runs)
#   pinned -> their latest release (what a fresh `pip install insetu` gets). akasa is resolved
#             through insetu's own dependency declaration, so pinning akasa in insetu's
#             pyproject.toml is picked up automatically. insetu keeps its committed sutram build.
#             A released sibling is only a dependency here: its own suite already ran when it was
#             released, so pinned mode runs suites only for the pushed repo and for insetu.
name: Stack battery

on:
  workflow_call:
    inputs:
      trigger_repo:
        description: "Repo that was pushed: akasa, sutram, or insetu"
        type: string
        required: true
      trigger_sha:
        description: "Commit under test in trigger_repo"
        type: string
        required: true
    secrets:
      STACK_READ_TOKEN:
        description: "Optional read-only token, needed only if any of the three repos is private"
        required: false

permissions:
  contents: read

jobs:
  battery:
    name: ${{ matrix.mode }} · py${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        mode: [main, pinned]
        python: ["3.10", "3.11", "3.12"]
    env:
      ORG_URL: https://github.com/Callosemic
      STACK: ${{ github.workspace }}/stack
      MODE: ${{ matrix.mode }}
      TRIGGER_REPO: ${{ inputs.trigger_repo }}
      TRIGGER_SHA: ${{ inputs.trigger_sha }}
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONUNBUFFERED: "1"
    defaults:
      run:
        shell: bash
    steps:
      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Assemble stack (${{ matrix.mode }})
        env:
          STACK_READ_TOKEN: ${{ secrets.STACK_READ_TOKEN }}
        run: |
          set -euo pipefail
          case "$TRIGGER_REPO" in
            akasa|sutram|insetu) ;;
            *) echo "::error::Unknown trigger_repo '$TRIGGER_REPO'"; exit 1 ;;
          esac

          if [ -n "${STACK_READ_TOKEN:-}" ]; then
            git config --global url."https://x-access-token:${STACK_READ_TOKEN}@github.com/".insteadOf "https://github.com/"
          fi

          latest_release() {
            git ls-remote --tags --refs "$ORG_URL/$1.git" 'v*' \
              | awk -F/ '{print $3}' \
              | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
              | sort -V | tail -n1 || true
          }
          default_branch() {
            git ls-remote --symref "$ORG_URL/$1.git" HEAD | awk '/^ref:/ {sub("refs/heads/", "", $2); print $2}'
          }
          resolve() {
            if [ "$1" = "$TRIGGER_REPO" ]; then echo "$TRIGGER_SHA"
            elif [ "$MODE" = main ]; then default_branch "$1"
            else
              local tag; tag="$(latest_release "$1")"
              if [ -z "$tag" ]; then echo "::error::No vX.Y.Z release tag found for $1" >&2; exit 1; fi
              echo "$tag"
            fi
          }
          checkout() {
            git clone --quiet --filter=blob:none "$ORG_URL/$1.git" "$STACK/$1"
            git -C "$STACK/$1" -c advice.detachedHead=false checkout --quiet "$2"
            echo "| $1 | \`$2\` | \`$(git -C "$STACK/$1" rev-parse --short HEAD)\` |" >> "$GITHUB_STEP_SUMMARY"
          }

          {
            echo "### Stack under test: ${MODE} · py${{ matrix.python }} (triggered by ${TRIGGER_REPO})"
            echo "| repo | ref | commit |"
            echo "|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"

          mkdir -p "$STACK"
          insetu_ref="$(resolve insetu)"; checkout insetu "$insetu_ref"
          sutram_ref="$(resolve sutram)"; checkout sutram "$sutram_ref"

          python -m pip install --upgrade pip
          # insetu first: in pinned mode this pulls akasa from PyPI exactly as a user's install would.
          pip install -e "$STACK/insetu[all]"

          if [ "$TRIGGER_REPO" = akasa ] || [ "$MODE" = main ]; then
            akasa_ref="$(resolve akasa)"; checkout akasa "$akasa_ref"
            # --no-deps: override the PyPI akasa even if insetu later pins an older release.
            pip install --no-deps -e "$STACK/akasa"
          else
            akasa_version="$(python -c 'import importlib.metadata as m; print(m.version("akasa"))')"
            # The sibling checkout sits at the exact installed release, so akasa's suite and
            # insetu's sibling path both see the same code pip installed.
            checkout akasa "v${akasa_version}"
          fi

      - name: Build any missing third-party vendor bundles
        run: |
          set -euo pipefail
          # insetu commits its vendored bundles, so this is normally a no-op. It only builds a
          # library whose vendor directory is absent (for example after untracking vendor/).
          vendor="$STACK/insetu/insetu/static/vendor"
          for pair in codemirror:codemirror jsyaml:js-yaml lit:lit lucide:lucide zustand:zustand; do
            script="${pair%%:*}"; dir="${pair##*:}"
            if [ ! -d "$vendor/$dir" ]; then bash "$STACK/insetu/scripts/vendor_${script}.sh"; fi
          done

      - name: Vendor sutram into insetu
        # pinned: insetu keeps the sutram build it committed (what its release ships), unless
        # sutram itself was pushed. main: re-vendor from the sutram checkout, like the live workbench.
        if: matrix.mode == 'main' || inputs.trigger_repo == 'sutram'
        run: |
          set -euo pipefail
          mkdir -p "$STACK/insetu/insetu/static/vendor"
          bash "$STACK/insetu/scripts/vendor_sutram.sh" "$STACK/sutram"

      - name: akasa · unit
        if: matrix.mode == 'main' || inputs.trigger_repo == 'akasa'
        working-directory: stack/akasa
        run: python tests/run_unit_tests.py

      - name: akasa · fitness
        if: matrix.mode == 'main' || inputs.trigger_repo == 'akasa'
        working-directory: stack/akasa
        run: python tests/fitness_functions.py

      - name: sutram · unit
        if: matrix.mode == 'main' || inputs.trigger_repo == 'sutram'
        working-directory: stack/sutram
        run: python tests/run_unit_tests.py

      - name: sutram · fitness
        if: matrix.mode == 'main' || inputs.trigger_repo == 'sutram'
        working-directory: stack/sutram
        run: python tests/fitness_functions.py

      - name: insetu · unit
        working-directory: stack/insetu
        run: python tests/run_unit_tests.py

      - name: insetu · fitness
        working-directory: stack/insetu
        run: python tests/fitness_functions.py
