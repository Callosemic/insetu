[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
[project]
name = "insetu"
version = "0.10.0"
description = "A local-first AI Developer OS, Context Gatherer, and Kanban Tracker."
readme = "readme.md"
authors = [{ name = "inSetu Contributors", email = "hello@insetu.io" }]
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: User Interfaces",
]
dependencies = [
    "Flask>=3.0.0",
    "flask-sock>=0.6.0",
    "watchdog>=3.0.0",
    "cryptography>=41.0.0"
]

[project.urls]
Homepage = "https://github.com/Callosemic/insetu"
Repository = "https://github.com/Callosemic/insetu.git"
Documentation = "https://github.com/Callosemic/insetu#readme"
"Bug Tracker" = "https://github.com/Callosemic/insetu/issues"
[project.optional-dependencies]
all = [
    "mistune>=3.0.0",
    "beautifulsoup4>=4.12.0",
    "markdownify>=0.11.0",
    "jsbeautifier>=1.14.0",
    "playwright>=1.40.0",
    "python-semantic-release>=9.0.0"
]

[project.scripts]
# This allows the user to type `insetu serve` from anywhere
insetu = "insetu.cli:main"
[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
insetu = [
    "static/**/*",
    "templates/**/*",
    "defaults/**/*"
]
[tool.semantic_release]
version_toml = [
    "pyproject.toml:project.version"
]
commit_parser = "conventional"
allow_zero_version = true
major_on_zero = false
[tool.semantic_release.changelog]
exclude_commit_patterns = [
    '''(?i)chore(?:\([^\)]*?\))?: .+$''',
    '''(?i)ci(?:\([^\)]*?\))?: .+$'''
]
