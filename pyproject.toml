[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "insetu"
version = "0.9.0"
description = "A local-first AI Developer OS, Context Gatherer, and Kanban Tracker."
authors = [{ name = "inSetu Contributors", email = "hello@insetu.io" }]
requires-python = ">=3.10"
dependencies = [
    "Flask>=3.0.0",
    "flask-sock>=0.6.0",
    "watchdog>=3.0.0",
    "cryptography>=41.0.0",
    "mistune>=3.0.0"
]

[project.optional-dependencies]
all = [
    "beautifulsoup4>=4.12.0",
    "markdownify>=0.11.0",
    "jsbeautifier>=1.14.0",
    "playwright>=1.40.0"
]

[project.scripts]
# This allows the user to type `insetu serve` from anywhere
insetu = "insetu.cli:main"

[tool.setuptools]
# Ensure the UI assets are packaged with the Python code
include-package-data = true
packages = ["insetu"]
[tool.semantic_release]
version_toml = [
    "pyproject.toml:project.version"
]
commit_parser = "angular"
