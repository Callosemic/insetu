<!DOCTYPE html>
<html>
<head>
    <title>{{ title }}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#121212">
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" type="image/png" href="/favicon.ico?v={{ title|urlencode }}">

    <script type="importmap">
    {
        "imports": {
            "lit": "https://cdn.jsdelivr.net/gh/lit/dist@3/core/lit-core.min.js"
        }
    }
    </script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div id="js-panic-button" style="padding: 40px 20px; text-align: center; font-family: var(--font-mono); color: var(--text); z-index: 9999; position: relative;">
        <h3 style="margin-top: 0; color: var(--text); opacity: 0.8;">⏳ Loading inSetu Developer OS...</h3>
        <p style="font-size: 0.85rem; color: #888; margin-top: 10px;">
            If this screen remains visible, the UI engine has stalled.<br><br>
            <a href="#" onclick="event.preventDefault(); fetch('/api/system/panic', {method: 'POST'}); this.parentElement.innerHTML='Rebooting Engine...'; setTimeout(()=>window.location.reload(), 3000);" style="color: #ef4444; text-decoration: underline; font-weight: bold;">[Boot Recovery OS]</a>
        </p>
    </div>

    <script>
        window.ACTIVE_EXTENSIONS = {{ extensions|tojson|safe }};
    </script>
    <div class="top-bar">
        <div class="tabs" id="main-tabs-container">
            <div class="tab" onclick="switchTab(event, 'context')">Context</div>
            <div class="tab" onclick="switchTab(event, 'edit')">Edit</div>
        </div>
        <div style="display: flex; align-items: center; justify-content: flex-end;">
            <button id="settings-toggle" class="system-action-btn">{{ emoji }}</button>
            <div id="settings-menu" style="display: none; position: absolute; top: 100%; right: 0; margin-top: 10px; background: var(--pane-bg); border: 1px solid var(--border); border-radius: 6px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); width: 280px; z-index: 2000; overflow: hidden;">
                <h4 id="workspaces-header" style="display: none; margin: 0 0 10px 0; border-bottom: 1px solid var(--border); padding-bottom: 5px; font-size: 0.9rem; color: var(--text);">Workspace</h4>
                <div id="workspaces-list" style="display: none; flex-direction: column; gap: 5px; margin-bottom: 15px;"></div>

                <h4 style="margin: 0 0 10px 0; border-bottom: 1px solid var(--border); padding-bottom: 5px; font-size: 0.9rem; color: var(--text);">Theme</h4>
                <div style="display: flex; flex-direction: column; gap: 5px;">
                    <button class="theme-btn" data-theme-value="light" style="margin: 0; background: transparent; color: var(--text); text-align: left; padding: 6px; border: 1px solid transparent; cursor: pointer;">☀️ Light</button>
                    <button class="theme-btn" data-theme-value="dark" style="margin: 0; background: transparent; color: var(--text); text-align: left; padding: 6px; border: 1px solid transparent; cursor: pointer;">🌙 Dark</button>
                    <button class="theme-btn" data-theme-value="e-ink" style="margin: 0; background: transparent; color: var(--text); text-align: left; padding: 6px; border: 1px solid transparent; cursor: pointer;">📖 E-Ink</button>
                </div>
                <h4 style="margin: 15px 0 10px 0; border-bottom: 1px solid var(--border); padding-bottom: 5px; font-size: 0.9rem; color: var(--text);">System</h4>
                <div style="display: flex; flex-direction: column; gap: 5px;">
                    <button id="full-refresh-btn" onclick="fullRefresh()" style="margin: 0; background: transparent; color: #ef4444; text-align: left; padding: 6px; border: 1px solid transparent; cursor: pointer; font-weight: bold;">🔄 Full Refresh</button>
                    <button id="btn-settings-more" onclick="document.getElementById('settings-menu').style.display='none'; document.getElementById('settings-modal').style.display='block';" style="margin: 0; background: transparent; color: var(--btn); text-align: left; padding: 6px; border: 1px solid transparent; cursor: pointer; font-weight: bold;">⚙️ More...</button>
                </div>
            </div>
        </div>
    </div>
    <div id="tab-context" class="tab-content">
        <div class="sub-tabs-bar">
            <div class="sub-tabs"></div>
            <div class="sub-tabs-actions" style="display: flex; gap: 8px; align-items: center;"></div>
        </div>
        <div class="screen active"></div>
    </div>

    <div id="tab-edit" class="tab-content">
        <div class="sub-tabs-bar">
            <div class="sub-tabs"></div>
            <div class="sub-tabs-actions" style="display: flex; gap: 8px; align-items: center;"></div>
        </div>
        <div class="screen active"></div>
    </div>
<style>
    /* 1. Automatically kill the background body scrollbar when any modal/editor is open */
    body:has(.fullscreen-modal[style*="display: block"]),
    body:has(.fullscreen-modal[style*="display: flex"]),
    body:has(#file-modal[style*="display: block"]) { 
        overflow: hidden; 
    }
    /* 2. Force CodeMirror 6 to have no borders and fit full-screen */
    #file-modal .cm-editor { border: none !important; height: 100%; background: var(--bg) !important; color: var(--text) !important; }
    #file-modal .cm-scroller { overflow: auto !important; }
    #file-modal .cm-gutters { background-color: var(--input-bg) !important; border-right: 1px solid var(--border) !important; color: var(--text-muted) !important; }
    /* 3. Force ALL other modals (Browse, Tasks, config) to act as native edge-to-edge parallel views */
    .fullscreen-modal { background: var(--bg) !important; padding: 0 !important; }
    .fullscreen-modal .modal-content, .fullscreen-modal .modal-panel, #file-modal > div { border: none !important; border-radius: 0 !important; max-width: 100vw !important; max-height: 100dvh !important; height: 100dvh !important; box-shadow: none !important; background: var(--bg) !important; }
.fullscreen-modal .modal-header, .fullscreen-modal .modal-footer { background: var(--input-bg) !important;
}
</style>
<div id="file-modal" class="fullscreen-modal" style="display: none; z-index: 1050;">
<div style="display: flex; flex-direction: column; height: 100dvh; width: 100vw;">
    <div style="display: flex; justify-content: space-between; align-items: center; padding: 12px 20px 0 20px; background: var(--input-bg); border-bottom: none; flex-shrink: 0;">
            <h3 id="modal-title" style="margin: 0; font-size: 1.1rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 60%; direction: rtl; text-align: left; color: var(--text);"
    title="File Content">File Content</h3>
            <div style="display: flex; gap: 10px;">
                <button id="modal-save-btn" onclick="saveModalFile()" class="btn-sm" style="background: #f59e0b; display: none; margin: 0;">💾 Save</button>
                <button onclick="closeFileModal()" class="btn-sm" style="background: #64748b; margin: 0;">Back</button>

            </div>
            </div>
        <div id="modal-action-toolbar" style="display: none; gap: 10px; margin: 0 !important; padding: 10px 20px 12px 20px; background: var(--input-bg); border: none !important; border-bottom: 1px solid var(--border) !important; border-radius: 0; align-items: center; position: relative; flex-shrink: 0;">
            <button id="btn-menu-file" class="btn-sm" style="background: transparent; color: var(--text); border: 1px solid var(--border); margin: 0; font-weight: bold;">📁 File ▾</button>
            <button id="btn-menu-edit" class="btn-sm" style="background: transparent; color: var(--text); border: 1px solid var(--border); margin: 0; font-weight: bold;">📝 Edit ▾</button>
            <button id="btn-menu-ext" class="btn-sm" style="background: transparent; color: var(--text); border: 1px solid var(--border); margin: 0; font-weight: bold; display: none;">🧩 Extensions ▾</button>
        </div>

        <div id="modal-truncation-banner" style="display: none; background: #f59e0b; color: #000; padding: 8px 20px; font-weight: bold; justify-content: space-between; align-items: center; flex-shrink: 0; border-bottom: 1px solid var(--border);">
            <span id="modal-truncation-msg">⚠️ Truncated</span>
            <button onclick="loadFullModalText()" class="btn-sm" style="background: #000; color: #f59e0b; margin: 0; border: 1px solid #000;">Show All</button>
        </div>
        <div id="modal-cm6-container" class="EasyMDEContainer" style="flex: 1; display: flex; flex-direction: column; min-height: 0; overflow: hidden; background: var(--bg);"></div>
        <textarea id="modal-text" style="display: none;"></textarea>
        <div class="modal-footer">
            <button id="modal-dl-btn" draggable="true" class="ui-draggable-export" onclick="downloadFromModal()" style="background: #0284c7; color: white;">⬇️ Download</button>
            <button onclick="copyFromModal()" style="background: #10b981; color: white;">📋 Copy</button>
        </div>
    </div>
</div>
    <div id="settings-modal" class="fullscreen-modal" style="z-index: 1100;">
        <div class="modal-content" style="max-height: 500px; height: auto; display: flex; flex-direction: column;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                <h3 style="margin:0; font-size: 1.1rem;">System Settings & Extensions</h3>
                <button onclick="document.getElementById('settings-modal').style.display='none'" class="btn-sm" style="background: #64748b; margin: 0;">Back</button>
            </div>
            <div id="settings-modal-links" style="display: flex; flex-direction: column; gap: 10px; flex: 1; overflow-y: auto; margin-bottom: 20px;">
                </div>
            <div style="border-top: 1px solid var(--border); padding-top: 15px; display: flex; justify-content: flex-end;">
                <button id="simulate-panic-btn" onclick="simulatePanic()" class="btn-sm" style="background: #f59e0b; margin: 0; font-weight: bold;">⚠️ Test Recovery</button>
            </div>
        </div>
    </div>


    <div id="global-status-bar" class="bottom-bar" data-default="{{ title }}">{{ title }}</div>

    <script type="module" src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
